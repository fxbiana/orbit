# One command starts the API and the website.
# Saving a file under backend/ restarts the API process.
# The extension is later. It is not started here.

name: ticket-trapper

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    ports:
      - "5000:5000"
    environment:
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase.json
    volumes:
      - ./backend:/workspace/backend
      - ./web:/workspace/web
      - ./.env:/workspace/.env:ro
      - type: bind
        source: ${FIREBASE_CREDENTIALS_PATH:?Set FIREBASE_CREDENTIALS_PATH in the root .env}
        target: /run/secrets/firebase.json
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    init: true
    ports:
      - "5174:5174"
    environment:
      DOCKER: "1"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const n=require('net');const s=n.connect(5174,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

volumes:
  web_node_modules:
